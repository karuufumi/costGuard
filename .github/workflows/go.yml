name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go version
        run: |
          go version
          case "$(go env GOVERSION)" in
            go1.26.*) ;;
            *) echo "Expected Go 1.26.x, got $(go env GOVERSION)"; exit 1 ;;
          esac

      - name: Check dependencies
        run: |
          go mod tidy
          go mod verify
          go list -m all
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Generate OpenAPI
        run: go generate .

      - name: Check OpenAPI artifacts
        run: git diff --exit-code -- docs/swagger.json docs/swagger.yaml

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: Build
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w" \
            -o dist/costguard \
            .

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
